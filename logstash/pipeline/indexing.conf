
input {
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  if [operation] not in ["index", "delete"] {
    drop {}
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "paperless-documents"

    document_id => "%{[id]}"
    action => "%{[operation]}"

    ilm_enabled => false
  }
}
