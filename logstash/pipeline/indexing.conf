
input {
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  if [operation] not in ["index", "delete"] {
    drop {}
  }

  mutate {
    add_field => {
      "[@metadata][es_action]" => "%{[operation]}"
    }

    remove_field => [
      "operation",
      "@version",
      "host",
      "port",
      "@timestamp"
    ]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "paperless-documents"
    document_id => "%{[id]}"
    action => "%{[@metadata][es_action]}"
    ilm_enabled => false
  }
}
