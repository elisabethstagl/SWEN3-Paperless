<mat-card class="document-card" appearance="outlined" (click)="openDocument()">
  {{ document().summary }}
  <div class="card-header">
    <div class="icon-badge">
      <mat-icon class="doc-icon">description</mat-icon>
    </div>

    <div class="card-heading">
      <h2 class="doc-filename" [matTooltip]="document().filename"
          matTooltipPosition="above">{{ document().filename }}</h2>
      <p class="doc-creator">{{ document().creator }}</p>
    </div>
  </div>
  <div class="button-container">
    <button class="delete-button" matMiniFab aria-label="Delete document"
            matTooltip="Delete" (click)="$event.stopPropagation(); delete.emit(document().id)">
      <mat-icon>delete</mat-icon>
    </button>
<!--    <button class="add-note-button" matMiniFab aria-label="Add note"-->
<!--            matTooltip="Add Note" (click)=" $event.stopPropagation(); openNoteModal()">-->
<!--      <mat-icon>note_add</mat-icon>-->
<!--    </button>-->
    <button class="download-button" matMiniFab aria-label="Download document"
            matTooltip="Download" (click)="$event.stopPropagation()">
      <mat-icon>download</mat-icon>
    </button>
  </div>
</mat-card>
