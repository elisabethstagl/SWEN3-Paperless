
<div class="header-section">
  <div class="header-content">
    <div class="header-text">
      <h1 class="title">
        <a routerLink="/">Folium</a>
      </h1>
      <h3 class="subtitle">A home for all your documents</h3>
    </div>

    <div class="header-search">
      <mat-form-field appearance="outline" class="search-field">
        <mat-icon matPrefix>search</mat-icon>

        <input
          matInput
          #searchInput
          type="search"
          [placeholder]="placeholder()"
          [attr.aria-label]="placeholder()"
          [formField]="searchForm"
          (keyup.enter)="search(searchInput.value)"
        />

      </mat-form-field>
    </div>
  </div>

  <img class="books-img-1"
       src="assets/images/bookshelf.svg"
       alt="bookshelf">

  <img class="books-img-2"
       src="assets/images/bookshelf-1.svg"
       alt="bookshelf-1">

  <img class="plant-img"
       src="assets/images/plant-3.svg"
       alt="plant">

  <mat-divider></mat-divider>
</div>
