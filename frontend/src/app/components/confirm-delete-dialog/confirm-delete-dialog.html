<h2 mat-dialog-title>Delete {{ data.itemType }}?</h2>

<mat-dialog-content>
  Are you sure you want to delete this {{ data.itemType }}?
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button [mat-dialog-close]="false">
    Cancel
  </button>

  <button mat-flat-button [mat-dialog-close]="true">
    Delete
  </button>
</mat-dialog-actions>
