spring.application.name=swen3-paperless

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

paperless.rabbitmq.ocr-request-queue=ocr.request
paperless.rabbitmq.ocr-result-queue=ocr.result
paperless.rabbitmq.genai-request-queue=genai.request
paperless.rabbitmq.genai-result-queue=genai.result

server.port=8081