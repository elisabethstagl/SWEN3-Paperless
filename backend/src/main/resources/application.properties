spring.application.name=swen3-paperless

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

paperless.rabbitmq.ocr-request-queue=${OCR_REQUEST_QUEUE}
paperless.rabbitmq.ocr-result-queue=${OCR_RESULT_QUEUE}
paperless.rabbitmq.genai-request-queue=${GENAI_REQUEST_QUEUE}
paperless.rabbitmq.genai-result-queue=${GENAI_RESULT_QUEUE}

minio.url=${MINIO_URL:http://localhost:9000}
minio.access.name=${MINIO_ROOT_USER}
minio.access.secret=${MINIO_ROOT_PASSWORD}
minio.bucket.name=${MINIO_BUCKET:documents}

server.port=8081

logging.level.root=INFO
logging.level.at.fhtw.backend=DEBUG

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB